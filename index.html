<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Agente Studio</title>
<meta name="description" content="Anyone can buy the AI. Almost nobody can cut it to fit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Instrument+Sans:wght@400;500&display=swap">
<style>
:root {
  --paper:  #f7f7f5;
  --ink:    #101114;
  --muted:  #6b6b71;
  --line:   #c9c8c3;
  --ink-inverse: #f7f7f5;
  --display: "Bodoni Moda", "Bodoni MT", Didot, Georgia, serif;
  --sans: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --edge: clamp(1.25rem, 5vw, 4rem);

  /* how far the parcel is open: 0 = still wrapped, 1 = fully opened.
     Stays at 1 without a pointer, so the page holds as a still poster. */
  --open: 1;
  --cut: 100%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e0e10;
    --ink:   #f0efec;
    --muted: #9a9aa0;
    --line:  #3a3a41;
    --ink-inverse: #0e0e10;
  }
}
:root[data-theme="dark"] {
  --paper: #0e0e10;
  --ink:   #f0efec;
  --muted: #9a9aa0;
  --line:  #3a3a41;
  --ink-inverse: #0e0e10;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow-x: clip;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

.stage {
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: minmax(0, 1fr);
  padding: clamp(1.25rem, 3vh, 2.25rem) var(--edge) clamp(1.5rem, 4vh, 2.5rem);
  gap: clamp(1.25rem, 3vh, 2.5rem);
}

.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.mark { font-family: var(--display); font-size: 1.1rem; white-space: nowrap; }
.mark span { font-style: italic; }
.top-link {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  text-decoration: none;
  padding-bottom: 3px;
  border-bottom: 1px solid var(--ink);
  white-space: nowrap;
}

/* The parcel: the phrase is set twice, solid and in outline. The seam runs
   across the page and everything above it is unwrapped. The seam follows the
   pointer, so the visitor is the one opening it. */
.parcel { position: relative; align-self: center; width: 100%; cursor: ns-resize; }
.blade { position: relative; width: max-content; max-width: 100%; margin-inline: auto; text-align: center; }
.blade h1 {
  position: relative;
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(1.75rem, min(16.5vw, 10.5vh), 7.2rem);
  line-height: 0.96;
  letter-spacing: -0.02em;
}
.blade .ghost {
  display: block;
  color: transparent;
  -webkit-text-stroke: 1px var(--line);
}
.blade .solid {
  position: absolute;
  inset: 0;
  color: var(--ink);
  clip-path: inset(0 0 calc(100% - var(--cut)) 0);
  transition: clip-path 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
.blade i { font-style: italic; }

.seam {
  position: absolute;
  top: var(--cut);
  left: calc(50% - 50vw);
  width: 100vw;
  height: 1px;
  background: var(--ink);
  opacity: 0.45;
  transition: top 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}
.live .solid, .live .seam { transition: none; }
.intro .solid, .intro .seam { transition-duration: 1.6s; }

.bottom {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: clamp(1.25rem, 3vw, 2.5rem);
  opacity: clamp(0, calc((var(--open) - 0.32) * 2.4), 1);
  transition: opacity 0.5s ease;
}
.bottom p { margin: 0; color: var(--muted); max-width: 34ch; font-size: 0.95rem; }
.btn {
  display: inline-block;
  background: var(--ink);
  color: var(--ink-inverse);
  text-decoration: none;
  font-size: 0.74rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  padding: 1.05rem 2.4rem;
  border: 1px solid var(--ink);
  white-space: nowrap;
  transition: background 0.25s ease, color 0.25s ease;
}
.btn:hover { background: transparent; color: var(--ink); }

@media (max-width: 640px) {
  .blade .ghost { -webkit-text-stroke-width: 0.6px; }
  .bottom { flex-direction: column; align-items: flex-start; }
}

@media (prefers-reduced-motion: reduce) {
  .blade .solid, .seam, .bottom, .btn { transition: none; }
}
</style>
</head>
<body>

<main class="stage" id="stage">

  <div class="top">
    <div class="mark">L'Agente <span>Studio</span></div>
    <a class="top-link" href="start.html">Book a fitting</a>
  </div>

  <div class="parcel" id="parcel">
    <div class="blade" id="blade">
      <h1>
        <span class="ghost" aria-hidden="true">Anyone<br>can buy<br>the AI.<br>Almost<br>nobody can<br><i>cut it to fit.</i></span>
        <span class="solid">Anyone<br>can buy<br>the AI.<br>Almost<br>nobody can<br><i>cut it to fit.</i></span>
      </h1>
    </div>
    <span class="seam" aria-hidden="true"></span>
  </div>

  <div class="bottom">
    <p>We measure how a company works, then tailor the machine to it.</p>
    <a class="btn" href="start.html">Book a fitting</a>
  </div>

</main>

<script>
(function () {
  var blade = document.getElementById("blade");
  var parcel = document.getElementById("parcel");
  var stage = document.getElementById("stage");
  if (!blade || !parcel || !stage) return;

  var fine = window.matchMedia && window.matchMedia("(pointer: fine)").matches;
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) return;

  var root = document.documentElement;
  var frame = null;
  var REST = 0.32;

  function set(open) {
    root.style.setProperty("--open", open.toFixed(3));
    root.style.setProperty("--cut", (open * 100).toFixed(2) + "%");
  }

  // The page arrives wrapped. With a pointer it cracks open and the visitor
  // does the rest; without one it unwraps itself, once, and stays open.
  var target = fine ? REST : 1;
  parcel.classList.add("intro");
  set(0);
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { set(target); });
  });
  setTimeout(function () { parcel.classList.remove("intro"); }, 1800);

  if (!fine) return;

  function track(event) {
    if (frame) return;
    frame = requestAnimationFrame(function () {
      frame = null;
      var box = blade.getBoundingClientRect();
      var y = (event.clientY - box.top) / box.height;
      set(Math.max(0, Math.min(1, y)));
    });
  }

  stage.addEventListener("pointerenter", function (event) {
    if (event.pointerType === "touch") return;
    parcel.classList.add("live");
    track(event);
  });
  stage.addEventListener("pointermove", function (event) {
    if (event.pointerType === "touch") return;
    track(event);
  });
  stage.addEventListener("pointerleave", function () {
    parcel.classList.remove("live");
    set(REST);
  });
})();
</script>
</body>
</html>
